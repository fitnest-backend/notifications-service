<!DOCTYPE html>
<html th:fragment="layout(title, content)" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title th:text="${title}">Fitnest</title>
    <style>
        /* Apple System Fonts fallback */
        body {
            margin: 0;
            padding: 0;
            background-color: #f4f4f6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            color: #131212;
        }

        .wrapper {
            width: 100%;
            table-layout: fixed;
            background-color: #f4f4f6;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        .main {
            background-color: #ffffff;
            margin: 0 auto;
            width: 100%;
            max-width: 588px;
            border-spacing: 0;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            border: 1px solid #ececed;
        }

        .header {
            background-color: #ffffff;
            padding: 32px 40px 20px 40px;
            text-align: center;
            border-bottom: 1px solid #ececed;
        }

        .header h1 {
            color: #00b4cc;
            margin: 0;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .content {
            padding: 40px;
            color: #131212;
            line-height: 1.6;
            font-size: 16px;
        }

        .footer {
            background-color: #fafafa;
            padding: 24px 40px;
            text-align: center;
            font-size: 13px;
            color: #8e8e93;
            border-top: 1px solid #ececed;
        }

        .button {
            display: inline-block;
            padding: 14px 32px;
            background-color: #00b4cc;
            color: #ffffff !important;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 16px;
            margin: 24px 0;
            transition: opacity 0.2s;
            box-shadow: 0 4px 12px rgba(0, 180, 204, 0.25);
            text-align: center;
        }

        .otp-code {
            font-size: 40px;
            font-weight: 700;
            color: #00b4cc;
            letter-spacing: 12px;
            background: #e6f7f9;
            padding: 24px;
            border-radius: 12px;
            text-align: center;
            margin: 32px 0;
            border: 1px solid #b3eaf2;
        }

        .highlight {
            color: #00b4cc;
            font-weight: 600;
        }

        @media screen and (max-width: 600px) {
            .wrapper {
                padding: 16px 10px;
            }
            .main {
                border-radius: 12px;
            }
            .header {
                padding: 24px 20px 16px 20px;
            }
            .content {
                padding: 28px 20px;
            }
            .footer {
                padding: 20px;
            }
            .otp-code {
                font-size: 32px;
                letter-spacing: 8px;
                padding: 18px;
            }
        }
    </style>
</head>

<body>
<div class="wrapper">
    <table class="main" align="center">
        <!-- Header -->
        <tr>
            <td class="header">
                <h1>Fitnest</h1>
            </td>
        </tr>

        <!-- Content Area -->
        <tr>
            <td class="content">
                <div th:replace="${content}">
                    <!-- Template content will be inserted here -->
                </div>
            </td>
        </tr>

        <!-- Footer -->
        <tr>
            <td class="footer">
                <p style="margin: 0; font-weight: 500;">&copy; 2026 Fitnest. Bütün hüquqlar qorunur.</p>
                <p style="margin: 6px 0 0;">Fitnest ilə sağlam həyata addım atın.</p>
            </td>
        </tr>
    </table>
</div>
</body>

</html>
